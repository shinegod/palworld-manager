name: golangci-lint 代码审查

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
      - name: Run golangci-lint
        run: |
          LOG=$($(go env GOPATH)/bin/golangci-lint run --timeout=10m --out-format=github-actions 2>&1)
          CODE=$?
          echo "$LOG"
          if [ $CODE -ne 0 ]; then
            FIRST=$(echo "$LOG" | grep -vE '^::' | head -3 | tr '\n' ' ' | cut -c1-300)
            echo "::error file=.github/workflows/lint.yml::lint failed: $FIRST"
            exit $CODE
          fi