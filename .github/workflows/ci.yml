name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # PalHook 通用 .so 编译检查 (manylinux2014 + gcc10, 与生产构建完全一致)
  palhook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal libpalhook.so
        run: |
          docker run --rm -v "$PWD":/build quay.io/pypa/manylinux2014_x86_64 bash -c "\
            /opt/rh/devtoolset-10/root/usr/bin/gcc -shared -fPIC -O2 -std=gnu17 -Wall -o /build/libpalhook.so /build/palhook.c -lpthread -ldl"
          ls -la libpalhook.so
      - uses: actions/upload-artifact@v4
        with:
          name: libpalhook.so
          path: libpalhook.so

  # 前端构建 (vue-tsc 类型检查 + vite 打包)
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # 面板后端 (前端产物需要先构建, embed 进 Go 二进制)
  panel:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./...
      - name: Build linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o dist/palmanager-linux-amd64 ./cmd/palmanager
      - uses: actions/upload-artifact@v4
        with:
          name: palmanager-linux-amd64
          path: dist/palmanager-linux-amd64
