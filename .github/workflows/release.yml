name: Release

# 打 tag (v*) 推送到 GitHub 即自动构建并发布 Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. PalHook 通用 .so (manylinux2014, GLIBC>=2.17 即可运行)
      - name: Build libpalhook.so
        run: |
          docker run --rm -v "$PWD":/build quay.io/pypa/manylinux2014_x86_64 bash -c "\
            /opt/rh/devtoolset-10/root/usr/bin/gcc -shared -fPIC -O2 -std=gnu17 -o /build/dist/libpalhook.so /build/palhook.c -lpthread -ldl"

      # 2. 前端 (embed 进面板二进制)
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web

      # 3. 面板多平台二进制
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum
      - name: Build panels
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux  GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VERSION" -o dist/palmanager-linux-amd64    ./cmd/palmanager
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w -X main.version=$VERSION" -o dist/palmanager-darwin-arm64   ./cmd/palmanager
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VERSION" -o dist/palmanager-darwin-amd64   ./cmd/palmanager
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VERSION" -o dist/palmanager-windows-amd64.exe ./cmd/palmanager

      # 4. 校验和
      - name: Checksums
        run: |
          cd dist
          md5sum * > MD5SUMS.txt
          sha256sum * > SHA256SUMS.txt
          ls -la

      # 5. 发布 GitHub Release
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* --generate-notes
